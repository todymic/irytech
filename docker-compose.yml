services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: irytech
      MYSQL_USER: irytech
      MYSQL_PASSWORD: irytech
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: irytech
      WORDPRESS_DB_USER: irytech
      WORDPRESS_DB_PASSWORD: irytech
      WORDPRESS_TABLE_PREFIX: wpjg_
      WORDPRESS_DEBUG: 0
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/irytech:/var/www/html/wp-content/themes/irytech

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/irytech:/var/www/html/wp-content/themes/irytech
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: irytech
      WORDPRESS_DB_USER: irytech
      WORDPRESS_DB_PASSWORD: irytech
      WORDPRESS_TABLE_PREFIX: wpjg_
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_data:
